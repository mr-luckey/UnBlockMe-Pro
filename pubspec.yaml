name: blocked
description: A creative spin on the classic sliding puzzle game.

publish_to: "none"

# App version — single source of truth for Android & iOS.
# Format: versionName+versionCode  (e.g. 11.0.3+12 → name "11.0.3", Play Store code 12)
version: 14.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  adaptive_theme: ^3.7.2
  async: ^2.13.1
  audio_session: ^0.2.2
  google_mobile_ads: ^8.0.0
  equatable: ^2.0.8
  flex_color_scheme: ^8.4.0
  flutter_bloc: ^9.1.1
  google_fonts: ^8.1.0
  yaml: ^3.1.0
  just_audio: ^0.10.4
  hive_flutter: ^1.1.0
  firebase_core: ^4.14.0
  firebase_analytics: ^12.5.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^1.0.0

dependency_overrides:
  path_provider_android: ^2.3.1
  path_provider: ^2.1.5

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/audio/bgm_forest.wav
    - assets/audio/sfx_hit.wav
    - assets/audio/sfx_slide.wav
    - assets/audio/sfx_tap.wav
    - assets/audio/sfx_win.wav
    - assets/ui/
    - assets/ui/home/
    - assets/ui/map/
    - assets/ui/play/
    - assets/ui/complete/
    - assets/notifications/
    - google_fonts/
