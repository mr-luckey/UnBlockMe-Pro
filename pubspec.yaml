name: blocked
description: A creative spin on the classic sliding puzzle game.

publish_to: "none"

version: 7.0.1

environment:
  sdk: ">=2.15.1 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  adaptive_theme: ^3.7.2
  archive: ^4.0.9
  async: ^2.13.1
  get: ^4.7.3
  google_mobile_ads: ^8.0.0
  cupertino_icons: ^1.0.9
  equatable: ^2.0.8
  flex_color_scheme: ^8.4.0
  flutter_bloc: ^9.1.1
  widget_bindings: ^1.0.0+1
  flutter_portal: ^0.4.0
  material_design_icons_flutter: ^5.0.6595
  shared_preferences: ^2.0.1
  google_fonts: ^8.1.0
  yaml: ^3.1.0
  assets_audio_player: ^3.1.1
  # easy_audience_network: ^0.0.7
  # facebook_audience_network: ^1.0.1
  win32: ^5.5.4
  # assets_audio_player_web: ^3.1.1
  # Disabled: this package ships Android Kotlin code using removed Registrar API.
  # assets_audio_player_web: ^3.1.1



dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^1.0.0

dependency_overrides:
  assets_audio_player_web:
    path: vendor/assets_audio_player_web_stub
  # assets_audio_player pulls an old Android implementation that still references
  # PluginRegistry.Registrar (removed with v1 embedding cleanup).
  path_provider_android: ^2.3.1
  path_provider: ^2.1.5

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/audio/bmusic.mp3
