name: assets_audio_player_web
description: Local stub override to avoid Android compilation of outdated web plugin.
version: 3.1.1
publish_to: "none"

environment:
  sdk: ">=2.17.0 <4.0.0"
  flutter: ">=3.0.0"

flutter:
  plugin:
    platforms:
      web:
        pluginClass: AssetsAudioPlayerWebPlugin
        fileName: assets_audio_player_web.dart
