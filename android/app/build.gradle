plugins {
    id 'com.android.application'
    id 'kotlin-android'
    // Must be applied after Android and Kotlin plugins.
    id 'dev.flutter.flutter-gradle-plugin'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.appware.blocked"
    compileSdk = 36
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_21.toString()
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.appware.blocked"
        // Groovy build scripts use Math.max(...) instead of Kotlin's maxOf(...).
        minSdk = Math.max(flutter.minSdkVersion, 24)
        targetSdk = 36
        // From pubspec.yaml `version:` — synced by Flutter on build (flutter.versionName/Code).
        versionCode flutter.versionCode
        versionName flutter.versionName
        multiDexEnabled true
    }
    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }



}

flutter {
    source '../..'
}

dependencies {
    implementation "com.google.android.gms:play-services-ads:25.1.0"
    implementation "androidx.multidex:multidex:2.0.1"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}

// Applied only after you add android/app/google-services.json from Firebase.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}
