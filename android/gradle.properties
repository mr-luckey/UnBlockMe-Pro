org.gradle.jvmargs=-Xmx4096M
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=false
android.enableMinifyInReleaseBuilds=true
android.enableShrinkResourcesInReleaseBuilds=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# The project lives on D: while the pub cache lives on C:. Kotlin's relocatable
# incremental caches build relative paths between the two and blow up on
# Windows because the drives differ, which corrupts the caches mid-build.
kotlin.incremental=false
